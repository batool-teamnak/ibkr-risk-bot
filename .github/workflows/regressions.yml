name: Offline protective-order regressions
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ib_insync==0.9.86 pytest pytest-asyncio
      - run: python -m unittest -v test_regressions
      - run: python -m pytest tests/test_state.py tests/test_bot.py -q
